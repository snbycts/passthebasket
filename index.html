<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fbf3e4">
<title>Pass the Basket · a Hendricks & Piper game</title>
<style>:root{--accent:#e8833a;--ink:#5a3b2e;--cream:#fbf1de;--paper:#fffaf0;--line:#efdcc0;--wood:#d9a066;--wood-d:#a8703f;--ok:#6f9a64;--bad:#c9524a;--role:#7fa874;--sb:env(safe-area-inset-bottom,0px);--pw:52px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#e6d9bf;color:var(--ink);font-family:ui-rounded,"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;font-size:16px;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{-webkit-user-select:text;user-select:text;font:inherit}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--cream);position:relative;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.18)}
#bar{flex:0 0 auto;height:50px;display:flex;align-items:center;gap:8px;padding:0 8px 0 10px;background:#fff;border-bottom:2px solid var(--line)}
.blogo{display:flex}.bname{flex:1;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;color:var(--ink)}.ib:active{background:var(--line)}
#role{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:5px 12px;background:var(--role);color:#fff;font-size:11.5px;letter-spacing:.04em}
#role[hidden]{display:none}#role b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#role .who{font-weight:800;background:rgba(0,0,0,.22);padding:3px 8px;border-radius:10px;white-space:nowrap}
.pips{display:flex;gap:4px}.pips i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35)}.pips i.done{background:#fff}.pips i.now{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.4)}
#view{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll,.body{overflow-y:auto;overscroll-behavior:contain}.body{flex:1;min-height:0;padding-bottom:10px}
.centre{align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px}
.dim{color:#a39688;font-size:13px}
.fine{font-size:13px;color:#8c8076;margin:4px 12px}
/* buttons */
.btn{min-height:50px;border:0;border-radius:15px;padding:0 20px;background:var(--accent);color:#fff;font-weight:800;font-size:17px;box-shadow:0 4px 0 rgba(0,0,0,.2);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.15}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn:disabled{opacity:.4;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.alt{background:var(--ok)}.btn.danger{background:var(--bad)}.btn.light{background:#fff;color:var(--role)}
.btn.big{min-height:60px;font-size:19px;width:100%}.btn.big small{display:block;font-weight:600;font-size:12.5px;opacity:.9;margin-top:2px}
.btn.grow{flex:1}.btn.m-cash{background:var(--ok)}.btn.m-card{background:#3b6fb6}
.pulse{animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 4px 0 rgba(0,0,0,.2),0 0 18px 7px var(--accent)}}
.actions .btn.ghost{padding:0 14px}.actions .btn{font-size:16px}.actions{flex:0 0 auto;display:flex;gap:10px;padding:10px 12px calc(10px + var(--sb));background:#fff;border-top:2px solid var(--line)}
/* title */
.title{align-items:center;padding:18px 18px 12px;text-align:center}
.tlogo{margin-top:6px;animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px) rotate(2deg)}}
.title h1{margin:10px 0 2px;font-size:32px;line-height:1.05}.sub{margin:0 0 12px;color:#8c8076}
.steps5{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 16px;counter-reset:s}
.steps5 li{counter-increment:s;font-size:11.5px;font-weight:800;background:#fff;border:2px solid var(--line);border-radius:12px;padding:5px 8px}
.steps5 li::before{content:counter(s) " ";color:var(--accent)}
.tbtns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:380px}
/* hand-off */
.handoff{background:var(--role);color:#fff;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px}
.handoff h2{font-size:27px;margin:6px 0 0;line-height:1.1}.handoff p{font-size:17px;margin:4px 0 10px;max-width:340px;opacity:.95}
.rolechip{background:#fff;color:var(--role);font-weight:900;font-size:22px;padding:6px 18px;border-radius:22px;letter-spacing:.04em;text-transform:uppercase}
.phone{animation:swing 1.6s ease-in-out infinite;transform-origin:50% 90%}@keyframes swing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) translateX(12px)}}
.hmeta{background:rgba(0,0,0,.2);padding:8px 14px;border-radius:12px;font-size:16px!important}
/* shelves */
.shelfwrap{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;scrollbar-width:none;background:linear-gradient(#f6ead0,#ecd9b3);border-bottom:5px solid var(--wood-d);position:relative}
.shelfwrap::-webkit-scrollbar{display:none}
.shelf{height:100%;display:flex;flex-direction:column;padding:4px 10px 0}
.srow{flex:1;min-height:0;display:flex;align-items:flex-end}
.bay{width:124px;flex:0 0 124px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 3px 4px;border-radius:10px;position:relative}
.slots{display:flex;align-items:flex-end;justify-content:center;gap:3px;width:calc(100% + 6px);padding-bottom:9px;background:linear-gradient(to top,var(--wood-d) 0 3px,var(--wood) 3px 9px,transparent 9px);min-height:calc(var(--pw)*1.34 + 9px)}
.slot{width:var(--pw);height:calc(var(--pw)*1.3333);flex:0 0 auto}
.slot svg,.trayitem svg,.bi svg,.mi svg,.bt svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 1px rgba(0,0,0,.25))}
.slot.empty{border:2px dashed rgba(138,90,43,.35);border-radius:9px;margin-bottom:0}
.shop .slot.empty{border-color:transparent}
.tag{width:100%;margin-top:5px;background:#fff;border:2px solid #d8c9a8;border-radius:6px;padding:2px 3px;text-align:center;font-size:10.5px;line-height:1.1;min-height:34px;display:flex;flex-direction:column;justify-content:center}
.tag b{font-weight:800}.tag span{color:var(--accent);font-weight:900;font-size:12px}
.bay.soldout .tag{opacity:.45}.bay.soldout .tag::after{content:"sold out";font-size:9px;color:var(--bad);font-weight:800}
.bay.hot,.dock.hot,.belt.hot,.scanner.hot,.shelfwrap.hot{outline:4px solid var(--ok);outline-offset:-4px;background-color:rgba(63,143,107,.18)}
.bay.hotbad{outline:4px solid var(--bad);outline-offset:-4px;background-color:rgba(194,37,59,.12)}
.bay.pulse{animation:glow .9s ease-in-out 2}@keyframes glow{50%{background:rgba(242,182,50,.45);transform:scale(1.03)}}
.dragpack{touch-action:none;cursor:grab}.dragpack.onshelf{touch-action:pan-x}.lifted{opacity:.25}
.dgh{position:fixed;left:0;top:0;z-index:999;pointer-events:none;filter:drop-shadow(0 10px 8px rgba(0,0,0,.35));will-change:transform}
.dgh svg{width:100%;height:auto;display:block}
/* stock room */
.stockroom{flex:0 0 auto;background:var(--wood);background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 14px);padding:7px 8px 8px;border-top:4px solid var(--wood-d)}
.sr-head{display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:11.5px;letter-spacing:.06em;margin-bottom:5px}
.sr-row{display:flex;justify-content:center;gap:6px;min-height:104px;padding:6px 4px;background:rgba(0,0,0,.2);border-radius:12px;align-items:flex-end}
.trayitem{width:62px;display:flex;flex-direction:column;align-items:center}
.trayitem svg{width:50px;height:67px}.trayitem small{color:#fff;font-size:10px;line-height:1.05;text-align:center;height:23px;overflow:hidden;margin-top:3px;font-weight:700}
.allin{color:#fff;font-weight:800;align-self:center}
/* basket dock */
.dock{flex:0 0 auto;height:150px;position:relative;background:#f6e9cf;border-top:3px solid var(--line);transition:transform .15s}
.dock.bump{animation:bump .3s}@keyframes bump{40%{transform:scale(1.025)}}
.dock-art{position:absolute;left:10px;right:10px;top:34px;bottom:8px;opacity:.9}.dock-art svg{width:100%;height:100%}
.dock-head{position:absolute;left:14px;right:14px;top:6px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.04em;z-index:2}.dock-head span{font-weight:800;color:var(--accent)}
.contents{position:absolute;left:22px;right:22px;top:36px;bottom:12px;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:2px 5px;z-index:2}
.bi{width:38px;height:51px}
/* checkout */
.card{background:#fff;border:2px solid var(--line);border-radius:14px;margin:8px 10px 0;padding:8px 10px}
.card h4{margin:0 0 6px;font-size:11px;letter-spacing:.08em;color:#8c8076}
.till{background:#2f3b4a;border-radius:14px;margin:8px 10px 0;padding:8px;font-family:"Courier New",monospace;color:#bfe9d1;flex:0 0 auto}
.lcd{display:flex;justify-content:space-between;align-items:flex-end;background:#173125;border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.2}
.lcd small{opacity:.65;font-size:10px;letter-spacing:.08em}.lcd .r{text-align:right}.lcd .big{font-size:28px;font-weight:700;color:#7dffb4}.lcd .flash{animation:flash .6s 3}@keyframes flash{50%{opacity:.25}}
.scanlog{padding:4px 6px 0;font-size:13px;min-height:44px}.scanlog>div{display:flex;justify-content:space-between}.scanlog>div:first-child{color:#7dffb4;font-weight:700}
.items{display:flex;flex-wrap:wrap;gap:4px;min-height:46px;align-items:flex-end}
.mi{width:38px;height:51px}.mi.sm{width:22px;height:30px}
.beltrow{display:flex;gap:8px;margin:8px 10px 0;flex:0 0 auto}
.belt{flex:1;height:88px;border-radius:12px;background:repeating-linear-gradient(90deg,#3b3f46 0 14px,#30333a 14px 28px);display:flex;align-items:center;gap:3px;padding:0 8px;overflow:hidden;color:#8d939c;font-size:13px}
.belt.moving{animation:belt .8s linear infinite}@keyframes belt{to{background-position:28px 0}}
.bt{flex:0 1 46px;min-width:20px;height:62px}
.scanner{width:88px;height:88px;border-radius:12px;background:#1d2229;border:3px solid #596273;position:relative;display:grid;place-items:end center;padding-bottom:6px;color:#e6525e;font-size:12px;letter-spacing:.1em;overflow:hidden}
.laser{position:absolute;left:8px;right:8px;height:3px;background:#ff3b4a;box-shadow:0 0 10px 3px rgba(255,59,74,.7);animation:laser 1.2s ease-in-out infinite alternate}@keyframes laser{from{top:12px}to{top:56px}}
.bagged .items{min-height:34px}
.hint{margin:8px 14px;font-weight:700;color:#6b5f55;text-align:center;font-size:14.5px}
.signon{width:100%;max-width:360px;text-align:left;padding:16px}.signon p{margin:6px 0 12px}.signon input{margin-bottom:14px}
.lcdtitle{background:#173125;color:#7dffb4;font-family:"Courier New",monospace;font-weight:700;padding:6px 10px;border-radius:8px;letter-spacing:.06em;font-size:14px}
label{display:block;font-weight:800;font-size:13px;margin:14px 0 6px}label small{font-weight:600;color:#8c8076}
input[type=text],input:not([type]),input[type=password]{width:100%;height:52px;border:3px solid #d8c9a8;border-radius:12px;padding:0 12px;font-size:18px;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{width:100%;border:3px solid #d8c9a8;border-radius:12px;padding:10px;font-size:14px;font-family:"Courier New",monospace}
/* tender */
.due{text-align:center}.due small{font-size:11px;letter-spacing:.1em;color:#8c8076}.due .big{font-size:44px;font-weight:900;color:var(--accent);line-height:1.05}.due .paying{font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:36px;align-items:center}
.chip{border:2px solid var(--line);background:#fff7e6;border-radius:18px;padding:5px 11px;font-weight:800;font-size:14px}.chip.pop{animation:pop .3s}@keyframes pop{from{transform:scale(0)}}
.status{margin-top:6px;font-weight:800;font-size:14px}.status.short{color:var(--bad)}.status.ok{color:var(--ok)}
.dens{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;flex:0 0 auto}
.den{height:60px;border:0;color:#fff;font-weight:900;font-size:19px;box-shadow:0 4px 0 rgba(0,0,0,.25);text-shadow:0 1px 1px rgba(0,0,0,.3)}.den:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.den.note{border-radius:8px;border:2px dashed rgba(255,255,255,.55)}.den.coin{border-radius:50%;width:60px;margin:0 auto;border:3px solid rgba(255,255,255,.5)}
.d5000{background:#c2476b}.d2000{background:#8a63c7}.d1000{background:#d9692b}.d500{background:#3f8f6b}
.d200{background:linear-gradient(135deg,#e0a21b 50%,#9aa3ad 50%)}.d100{background:#d9a21b}.d50,.d20,.d10{background:#9aa3ad}.d5{background:#aab2ba;font-size:16px}.d2,.d1{background:#b8693a}
.reader{margin:10px;background:#2f3b4a;border-radius:16px;padding:14px;color:#fff}.reader.ok{background:#25543f}
.rmsg{font-weight:800;text-align:center;margin-bottom:10px;font-size:15px}
.track{height:74px;background:#10151b;border-radius:37px;position:relative;overflow:hidden;box-shadow:inset 0 4px 8px rgba(0,0,0,.6)}
.arrows{position:absolute;right:20px;top:50%;transform:translateY(-50%);letter-spacing:.3em;color:#566174;font-weight:900;font-size:20px}
.cardbtn{position:absolute;left:4px;top:5px;width:112px;height:62px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#2f3b4a);touch-action:none;cursor:grab;box-shadow:0 4px 8px rgba(0,0,0,.5);overflow:hidden;font-size:9px;font-weight:800;letter-spacing:.05em;padding:42px 0 0 8px}
.cardbtn .stripe{position:absolute;left:0;right:0;top:9px;height:11px;background:#111}.cardbtn .chipc{position:absolute;right:10px;top:26px;width:18px;height:14px;border-radius:3px;background:#e9d96a}
.pinbox{text-align:center}.pinbox input{text-align:center;letter-spacing:.35em;font-size:24px;margin:8px 0 12px}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* accept + receipt */
.paid{margin:0;font-size:16px}.result p{margin:0 0 8px;font-size:16px}.result .change b{color:var(--ok);font-size:22px}
.stamp{display:inline-block;border:4px solid var(--ok);color:var(--ok);font-weight:900;font-size:26px;padding:4px 14px;border-radius:10px;transform:rotate(-6deg);animation:stamp .35s}@keyframes stamp{from{transform:scale(2.4) rotate(-6deg);opacity:0}}
.dots::after{content:"...";animation:dots 1s steps(4) infinite;display:inline-block;width:1.2em;text-align:left;overflow:hidden;vertical-align:bottom}@keyframes dots{from{width:0}to{width:1.2em}}
.st6{background:#d8c9ae}.rscroll{flex:1;min-height:0;overflow-y:auto;padding:10px 0 14px;overscroll-behavior:contain}
.printer{width:min(400px,94%);margin:0 auto;height:26px;background:#2f3b4a;border-radius:14px 14px 4px 4px;position:relative;z-index:2;box-shadow:0 4px 6px rgba(0,0,0,.3)}
.printer i{position:absolute;left:14px;right:14px;bottom:5px;height:5px;border-radius:3px;background:#0b0e12}
.paperwrap{width:min(380px,90%);margin:-3px auto 0;animation:reveal 2.2s steps(30) both;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.paperwrap img{width:100%;display:block}.rtext{background:#fffdf7;padding:14px;font-size:12px;white-space:pre-wrap;margin:0}
@keyframes reveal{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.rbar{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 10px;background:#efe3cc}
.rbar button{min-height:44px;border:2px solid var(--line);background:#fff;border-radius:12px;font-weight:800;font-size:13px}.rbar button:active{background:var(--line)}
/* setup */
.setup{background:var(--cream)}.tabs{display:flex;background:#fff;border-bottom:2px solid var(--line);flex:0 0 auto}
.tab{flex:1;min-height:48px;border:0;border-bottom:4px solid transparent;background:none;font-weight:800;font-size:15px}.tab.on{color:var(--accent);border-color:var(--accent)}
.panel{flex:1;min-height:0;overflow-y:auto;padding:4px 14px 18px;overscroll-behavior:contain}
.logos{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.lg{border:3px solid transparent;border-radius:50%;background:none;padding:0;line-height:0}.lg.on{border-color:var(--ink)}
.sw{display:flex;flex-wrap:wrap;gap:8px}.swb{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);padding:0;position:relative;overflow:hidden}.swb.on{box-shadow:0 0 0 3px var(--ink)}
.swb.custom input{position:absolute;inset:-6px;opacity:0;width:60px;height:60px;cursor:pointer}
.mini-rcpt{background:#fffdf7;border:2px solid var(--line);border-top:8px solid;border-radius:6px;text-align:center;padding:10px;line-height:1.3}.mini-rcpt b{display:block;font-size:20px}.mini-rcpt small{color:#8c8076}.mrl{line-height:0;margin-bottom:4px}
.ilist{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.irow{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 12px;min-height:56px;text-align:left}.irow svg{flex:0 0 auto}.in{flex:1;font-weight:800}.ip{font-weight:900;color:var(--accent)}
.segm{display:flex;gap:6px;flex-wrap:wrap}.segm button{flex:1;min-height:46px;border:2px solid var(--line);background:#fff;border-radius:12px;font-weight:800;padding:0 10px}.segm button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.three{display:flex;gap:10px;margin-top:18px}
.sheet-back{position:absolute;inset:0;background:rgba(30,20,10,.5);z-index:50;display:flex;align-items:flex-end}
.sheet{background:var(--paper);width:100%;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + var(--sb));animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0 0 4px;font-size:21px}
.prev{display:flex;align-items:center;gap:14px;justify-content:center;padding:10px;background:#f6e9cf;border-radius:14px;margin:8px 0}.ptag{background:#fff;border:2px solid #d8c9a8;border-radius:6px;padding:4px 10px;text-align:center}.ptag b,.ptag span{display:block}.ptag span{color:var(--accent);font-weight:900}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.opts button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:4px 2px;line-height:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px}.opts button.on{border-color:var(--ink);background:#fff7e6}.opts small{font-size:10px;font-weight:800}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%) translateY(10px);background:#2f3b4a;color:#fff;padding:10px 16px;border-radius:20px;opacity:0;transition:opacity .25s,transform .25s;z-index:80;pointer-events:none;max-width:90%;text-align:center;font-weight:700;font-size:14px}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (max-height:620px){.dock{height:128px}.sr-row{min-height:90px}.trayitem svg{width:42px;height:56px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* ===== kawaii autumn theme ===== */
html,body{background:#f0dcbc}
#app{background-color:var(--cream);background-image:radial-gradient(circle,rgba(232,131,58,.10) 3px,transparent 4px);background-size:38px 38px}
#bar{border-radius:0 0 22px 22px;box-shadow:0 4px 0 rgba(168,112,63,.18);z-index:3;position:relative}
#role{border-radius:0 0 18px 18px;margin:0 10px;font-weight:700}
.bname{color:var(--ink)}
.btn{border-radius:24px;box-shadow:0 5px 0 rgba(120,60,20,.28)}
.btn.ghost{border-width:3px;box-shadow:0 4px 0 var(--line)}
.btn.m-cash{background:#7fa874}.btn.m-card{background:#6f93a8}.btn.alt{background:#7fa874}
.actions{border-radius:22px 22px 0 0;box-shadow:0 -3px 0 var(--line);border-top:0}
.card{border-radius:22px;border-width:3px;box-shadow:0 3px 0 rgba(168,112,63,.12)}
.tag{border-radius:14px;border-color:#e6cfa8}
.shelfwrap{background-color:#f7e3c6;background-image:radial-gradient(circle,rgba(217,138,154,.22) 4px,transparent 5px);background-size:30px 30px}
.slots{border-radius:0 0 6px 6px}
.stockroom{border-radius:22px 22px 0 0}.sr-row{border-radius:18px}
.till{background:#5a3b2e;border-radius:22px}.lcd{background:#2f3a2a;border-radius:14px}
.steps5 li{border-radius:16px;border-color:#efdcc0}
.d5000{background:#d98a9a}.d2000{background:#a0688a}.d1000{background:#e8833a}.d500{background:#7fa874}.d100{background:#e0a93b}.d200{background:linear-gradient(135deg,#e0a93b 50%,#b3a79c 50%)}.d2,.d1{background:#bf7248}
.reader{background:#5a3b2e;border-radius:22px}.reader.ok{background:#5d7f52}.track{background:#2f211b}
.lcdtitle{background:#2f3a2a}
.tlogo{filter:drop-shadow(0 6px 0 rgba(168,112,63,.25))}
.sheet{border-radius:28px 28px 0 0}
.tab.on{color:var(--accent)}
.segm button.on{background:var(--accent)}
/* falling leaves */
.leaves{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.leaves i{position:absolute;top:-24px;width:15px;height:15px;background:var(--c);border-radius:0 100% 0 100%;opacity:.75;animation:fall 9s linear infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(26px,420px) rotate(200deg)}100%{transform:translate(-10px,880px) rotate(400deg)}}
.title,.handoff{position:relative}.title>*:not(.leaves),.handoff>*:not(.leaves){position:relative;z-index:1}
/* slimmer basket */
.dock{height:164px;background:transparent;border-top:0;display:flex;justify-content:center}
.dock-art{left:50%;right:auto;transform:translateX(-50%);width:min(250px,72%);top:2px;bottom:2px;opacity:1}
.dock-head{left:12px;right:12px;top:4px}
.dock.bump{animation:bump .3s}
.contents{left:50%;right:auto;transform:translateX(-50%);width:min(172px,50%);top:58px;bottom:12px;gap:2px 3px;align-content:flex-start}
.contents .bi{width:38px;height:51px}.contents.cs2 .bi{width:30px;height:40px}.contents.cs3 .bi{width:26px;height:35px}.contents.cs4 .bi{width:22px;height:29px}
.dock.hot{outline:4px dashed var(--ok);outline-offset:-4px;background-color:rgba(111,154,100,.15);border-radius:20px}
/* scanned tray + bag outline */
.scannedcard .items{min-height:56px}
.mi{width:38px;height:51px}
.bagcard h4{display:flex;justify-content:space-between;align-items:center}
.bagcard .kind{display:flex;gap:4px}.bagcard .kind button{border:2px solid var(--line);background:#fff;border-radius:12px;font-weight:800;font-size:11px;padding:3px 10px;color:var(--ink)}.bagcard .kind button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bagzone{position:relative;height:136px;display:flex;justify-content:center;border-radius:18px}
.bagzone.hot{outline:4px dashed var(--ok);outline-offset:-2px;background:rgba(111,154,100,.16)}
.bag-art{position:absolute;inset:0;display:flex;justify-content:center}.bag-art svg{height:100%;width:auto}
.bag-items{position:absolute;left:50%;transform:translateX(-50%);bottom:30px;width:104px;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-end;gap:2px;pointer-events:none}
.bgi{width:28px;height:37px}.bz2 .bgi{width:22px;height:29px}.bz3 .bgi{width:17px;height:23px}.bgi svg{width:100%;height:100%;display:block}
@media (max-height:700px){.bagzone{height:112px}.dock{height:140px}}
.btn.big{flex-direction:column;gap:0}

/* ===== Hendricks & Piper brand + red panda ===== */
#tip{flex:0 0 auto;display:flex;align-items:flex-end;gap:6px;padding:6px 12px 0;position:relative;z-index:2}
#tip[hidden]{display:none}
#tip .panda,.welcome .panda{flex:0 0 auto;border:0;background:none;padding:0;line-height:0;filter:drop-shadow(0 3px 0 rgba(168,112,63,.22))}
#tip .panda.hop svg{animation:hop .6s ease-out}@keyframes hop{30%{transform:translateY(-9px) rotate(-6deg)}60%{transform:translateY(0)}80%{transform:translateY(-3px)}}
.bubble{flex:1;position:relative;background:#fff;border:3px solid var(--line);border-radius:18px;padding:6px 12px;font-weight:700;font-size:13.5px;line-height:1.25;margin-bottom:6px;color:var(--ink);box-shadow:0 3px 0 rgba(168,112,63,.12)}
.bubble::before{content:"";position:absolute;left:-10px;bottom:12px;width:14px;height:14px;background:#fff;border-left:3px solid var(--line);border-bottom:3px solid var(--line);transform:rotate(45deg);border-radius:0 0 0 4px}
.brand{display:flex;align-items:center;gap:10px;margin:2px 0 0}
.brand .bw{display:flex;flex-direction:column;text-align:left;line-height:1.1}.brand b{font-size:17px;letter-spacing:.14em;color:var(--ink)}.brand small{font-size:11px;letter-spacing:.2em;color:#a39688;text-transform:uppercase}
.welcome{display:flex;align-items:flex-end;gap:6px;width:100%;max-width:380px;margin:0 0 12px}.welcome .bubble{text-align:left}
.brandline{text-align:center;letter-spacing:.12em;font-size:11.5px;text-transform:uppercase;margin-top:2px}
.bagzone{height:122px}.scanlog{min-height:40px}
@media (max-height:700px){#tip .bubble{font-size:12.5px;padding:4px 10px}#tip .panda svg{width:44px;height:44px}}
.scanlog{min-height:28px}.bagzone{height:112px}.belt{height:78px}.scanner{width:80px;height:78px}.bt{height:54px}.laser{animation-name:laser2}@keyframes laser2{from{top:10px}to{top:46px}}

/* on-screen PIN keypad */
.reader.done .track{display:none}.reader.done{padding:10px}.reader.done .rmsg{margin:0}
.pinbox{padding-bottom:12px}
.pindots{display:flex;justify-content:center;gap:14px;margin:6px 0 12px;padding:10px;background:#2f3a2a;border-radius:16px}
.pindots i{width:20px;height:20px;border-radius:50%;border:3px solid #7dffb4;opacity:.55}.pindots i.on{background:#7dffb4;opacity:1;box-shadow:0 0 10px #7dffb4}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:300px;margin:0 auto}
.key{height:58px;border:0;border-radius:20px;background:#fff7e6;color:var(--ink);font-size:26px;font-weight:900;box-shadow:0 5px 0 #e0c9a2;border:3px solid #efdcc0}
.key:active{transform:translateY(4px);box-shadow:0 1px 0 #e0c9a2;background:#ffe9c4}
.key.clr{background:#f6d3d8;box-shadow:0 5px 0 #e1aab4;border-color:#f0bcc5}.key.ok{background:#7fa874;color:#fff;box-shadow:0 5px 0 #587a50;border-color:#8fb585;font-size:22px}

/* v1.4 one-press bagging */
.scanrow{display:flex;align-items:center;gap:8px}.scanrow .items{flex:1;min-height:56px}
.minibag{position:relative;flex:0 0 74px;height:70px;line-height:0}.minibag svg{width:100%;height:100%}
.minibag.ready{animation:bagbob 1s ease-in-out infinite}@keyframes bagbob{50%{transform:translateY(-4px) rotate(-3deg)}}
.minibag.wob{animation:none}.minibag.wob svg{animation:bagwob .26s ease-out}@keyframes bagwob{30%{transform:scale(1.14,.9)}70%{transform:scale(.95,1.06)}}
.minibag .bagcount{position:absolute;right:-2px;top:-4px;background:var(--ok);color:#fff;font-weight:800;font-size:13px;line-height:1;border:3px solid #fff;border-radius:14px;padding:4px 7px}
.minibag.full{animation:none}
.sc{pointer-events:none}
</style>
</head>

<script>/* Pass the Basket: DOM-free game logic. Loadable in Node for tests. */
(function (root) {
  'use strict';
  const SHAPES = ['box', 'bottle', 'can', 'bag', 'jar', 'carton'];
  const PATTERNS = ['plain', 'stripe', 'band', 'dots', 'split', 'check', 'zig'];
  const HEX = /^#[0-9a-fA-F]{6}$/;

  /* ---------- seeded RNG ---------- */
  function hash(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^= h >>> 16) >>> 0;
  }
  function mulberry(a) {

      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function rngFrom(seed) { return mulberry(hash(String(seed))); }
  function shuffle(arr, rng) {
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
    return arr;
  }

  /* ---------- money ---------- */
  function money(p, cur) {
    cur = cur || '£';
    const neg = p < 0; p = Math.abs(Math.round(p));
    return (neg ? '-' : '') + cur + Math.floor(p / 100) + '.' + String(p % 100).padStart(2, '0');
  }
  function denomLabel(d) { return d >= 100 ? '£' + (d / 100) : d + 'p'; }
  function parsePrice(str) {
    const s = String(str == null ? '' : str).replace(/[£\s]/g, '').replace(',', '.');
    if (!/^\d*\.?\d{0,2}$/.test(s) || s === '' || s === '.') return NaN;
    const p = Math.round(parseFloat(s) * 100);
    return p >= 1 && p <= 99999 ? p : NaN;
  }
  /* greedy breakdown of an amount into denominations: [{d, n}] */
  function denomsFor(amount, denoms) {
    const out = []; let left = Math.max(0, Math.round(amount));
    denoms.slice().sort((a, b) => b - a).forEach(d => { const n = Math.floor(left / d); if (n) { out.push({ d, n }); left -= n * d; } });
    return out;
  }
  function tenderTotal(map) { let t = 0; Object.keys(map || {}).forEach(k => { t += (+k) * (map[k] | 0); }); return t; }

  function two(n) { return String(n).padStart(2, '0'); }
  function fmtDate(d) { return two(d.getDate()) + '/' + two(d.getMonth() + 1) + '/' + d.getFullYear(); }
  function fmtTime(d) { return two(d.getHours()) + ':' + two(d.getMinutes()); }

  /* ---------- shelf layout ---------- */
  function layout(items) {
    const n = Math.max(1, items.length);
    const per = Math.max(4, Math.ceil(n / 3));
    const rows = Math.ceil(n / per);
    const bays = items.map((it, i) => ({ item: it.id, row: Math.floor(i / per), col: i % per }));
    return { per, rows, bays };
  }

  /* ---------- validation / sanitising ---------- */
  function cleanText(s, max) { return String(s == null ? '' : s).replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, max); }
  function sanitizeItem(raw, fallbackId) {
    if (!raw || typeof raw !== 'object') return null;
    const name = cleanText(raw.name, 24);
    const price = Number.isInteger(raw.price) ? raw.price : NaN;
    if (!name || !(price >= 1 && price <= 99999)) return null;
    let id = String(raw.id || '').toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 24);
    if (!id) id = fallbackId;
    return {
      id, name, price,
      shape: SHAPES.includes(raw.shape) ? raw.shape : 'box',
      c1: HEX.test(raw.c1) ? raw.c1.toLowerCase() : '#e8743b',
      c2: HEX.test(raw.c2) ? raw.c2.toLowerCase() : '#f4ead2',
      pattern: PATTERNS.includes(raw.pattern) ? raw.pattern : 'plain'
    };
  }
  function itemProblems(items) {
    const p = []; const seen = {};
    if (!Array.isArray(items) || items.length < 4) p.push('need at least 4 items');
    (items || []).forEach((it, i) => {
      if (!it.name) p.push('item ' + i + ' has no name');
      if (!(Number.isInteger(it.price) && it.price > 0)) p.push(it.id + ': bad price');
      if (!SHAPES.includes(it.shape)) p.push(it.id + ': bad shape');
      if (!PATTERNS.includes(it.pattern)) p.push(it.id + ': bad pattern');
      if (!HEX.test(it.c1) || !HEX.test(it.c2)) p.push(it.id + ': bad colour');
      if (seen[it.id]) p.push('duplicate id ' + it.id);
      seen[it.id] = 1;
    });
    return p;
  }

  function create(pack) {
    const P = pack;
    function defaultState() {
      return {
        v: 1,
        store: { name: P.settings.storeName, logoId: P.defaults.logoId, logoBg: P.defaults.logoBg },
        items: P.items.map(i => Object.assign({}, i)),
        settings: { bayCapacity: P.settings.bayCapacity, deliveryItems: P.settings.deliveryItems, basketMax: P.settings.basketMax, handoffs: P.settings.handoffs, tips: P.settings.tips !== false },
        shelf: {}, basket: [], operator: '', receiptNo: 1
      };
    }
    const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
    const capacity = S => clamp(S.settings.bayCapacity | 0 || 2, 1, 3);
    const itemById = (S, id) => S.items.find(i => i.id === id);
    const totalStock = S => S.items.reduce((t, i) => t + (S.shelf[i.id] || 0), 0);

    function makeDelivery(S, seed) {
      const cap = capacity(S), rng = rngFrom(seed);
      const need = shuffle(S.items.filter(i => (S.shelf[i.id] || 0) < cap), rng).slice(0, clamp(S.settings.deliveryItems | 0, 1, 40));

      need.forEach(i => { for (let k = S.shelf[i.id] || 0; k < cap; k++) out.push(i.id); });
      return shuffle(out, rng);
    }
    function stock(S, id) {
      if (!itemById(S, id) || (S.shelf[id] || 0) >= capacity(S)) return false;
      S.shelf[id] = (S.shelf[id] || 0) + 1; return true;
    }
    function pick(S, id) {
      if (!itemById(S, id) || (S.shelf[id] || 0) <= 0 || S.basket.length >= clamp(S.settings.basketMax | 0, 1, 24)) return false;
      S.shelf[id]--; S.basket.push(id); return true;
    }
    function putBack(S, idx) {
      if (idx < 0 || idx >= S.basket.length) return false;
      const id = S.basket.splice(idx, 1)[0];
      S.shelf[id] = (S.shelf[id] || 0) + 1; return true;
    }
    function returnBasket(S) { while (S.basket.length) putBack(S, 0); }

    function lines(S, ids) {
      const order = [], map = {};
      ids.forEach(id => {
        const it = itemById(S, id); if (!it) return;
        if (!map[id]) { map[id] = { id, name: it.name, unit: it.price, qty: 0, total: 0 }; order.push(id); }

      });
      return order.map(id => map[id]);
    }
    const total = (S, ids) => ids.reduce((t, id) => t + (itemById(S, id) ? itemById(S, id).price : 0), 0);

    function sanitizeState(obj) {
      const D = defaultState();
      if (!obj || typeof obj !== 'object') throw new Error('Not a save file');
      if (obj.format && obj.format !== 'pass-the-basket') throw new Error('Not a Pass the Basket save');
      const S = D;
      if (obj.store) {
        S.store.name = cleanText(obj.store.name, 28) || D.store.name;
        if (P.logos.some(l => l.id === obj.store.logoId)) S.store.logoId = obj.store.logoId;
        if (HEX.test(obj.store.logoBg)) S.store.logoBg = obj.store.logoBg.toLowerCase();
      }
      if (Array.isArray(obj.items)) {
        const seen = {}, items = [];
        obj.items.slice(0, 60).forEach((r, i) => {
          const it = sanitizeItem(r, 'item' + (i + 1)); if (!it) return;
          let id = it.id, k = 2; while (seen[id]) id = it.id + k++;
          it.id = id; seen[id] = 1; items.push(it);
        });
        if (items.length >= 4) S.items = items;
      }
      const st = obj.settings || {};
      S.settings.bayCapacity = clamp(parseInt(st.bayCapacity, 10) || D.settings.bayCapacity, 1, 3);
      S.settings.deliveryItems = clamp(parseInt(st.deliveryItems, 10) || D.settings.deliveryItems, 1, 40);
      S.settings.basketMax = clamp(parseInt(st.basketMax, 10) || D.settings.basketMax, 1, 24);
      S.settings.handoffs = st.handoffs === undefined ? D.settings.handoffs : !!st.handoffs;
      S.settings.tips = st.tips === undefined ? D.settings.tips : !!st.tips;
      const cap = capacity(S);
      S.shelf = {};
      if (obj.shelf && typeof obj.shelf === 'object') S.items.forEach(i => { const n = parseInt(obj.shelf[i.id], 10); if (n > 0) S.shelf[i.id] = Math.min(cap, n); });

      S.operator = cleanText(obj.operator, 16);

    }
    function serialize(S) {
      return { format: 'pass-the-basket', version: 1, store: S.store, items: S.items, settings: S.settings, shelf: S.shelf, receiptNo: S.receiptNo, operator: S.operator };
    }

    /* ---------- receipts ---------- */
    function receiptModel(S, sale) {
      const ls = lines(S, sale.ids);
      return {
        store: S.store.name, logoId: S.store.logoId, logoBg: S.store.logoBg,
        no: sale.no, date: sale.date, operator: sale.operator || 'Operator',
        lines: ls, count: sale.ids.length, total: total(S, sale.ids),
        method: sale.method, tendered: sale.tendered || 0, change: sale.change || 0
      };
    }
    const dateStr = fmtDate, timeStr = fmtTime;
    function receiptText(m) {
      const W = 32, rule = '-'.repeat(W);
      const pad = (l, r) => { l = String(l); r = String(r); const sp = Math.max(1, W - l.length - r.length); return l + ' '.repeat(sp) + r; };
      const out = [m.store.toUpperCase(), rule, 'Receipt #' + String(m.no).padStart(4, '0'), dateStr(m.date) + '  ' + timeStr(m.date), 'Served by: ' + m.operator, rule];
      m.lines.forEach(l => { out.push(pad((l.qty > 1 ? l.qty + ' x ' : '') + l.name, money(l.total))); if (l.qty > 1) out.push('    @ ' + money(l.unit) + ' each'); });

      if (m.method === 'cash') { out.push(pad('CASH TENDERED', money(m.tendered))); out.push(pad('CHANGE', money(m.change))); }
      else out.push(pad('CARD (PIN VERIFIED)', money(m.total)));
      out.push(rule, 'Thank you for shopping at', m.store + '!', 'See you again soon.', '', 'a Hendricks & Piper game');
      return out.join('\n');
    }

<script>/* Pass the Basket: draws a pretty receipt onto a canvas (for display, sharing and saving). */
(function (root) {
  'use strict';
  const W = 420, M = 18, PW = W - M * 2, PAD = 26, SC = 2;
  const MONO = '"Courier New", Courier, monospace';
  const SANS = 'ui-rounded, "Nunito", "Segoe UI", system-ui, sans-serif';
  const INK = '#5a3b2e', GREY = '#9a8678';

  function wrap(ctx, text, maxW) {
    const words = String(text).split(/\s+/), out = []; let cur = '';
    words.forEach(w => {
      const t = cur ? cur + ' ' + w : w;
      if (ctx.measureText(t).width <= maxW || !cur) cur = t; else { out.push(cur); cur = w; }
    });
    if (cur) out.push(cur);
    return out;
  }
  function fit(ctx, text, maxW) {
    if (ctx.measureText(text).width <= maxW) return text;
    while (text.length > 1 && ctx.measureText(text + '…').width > maxW) text = text.slice(0, -1);
    return text + '…';
  }
  function dashed(ctx, y, colour) {
    ctx.save(); ctx.strokeStyle = colour || '#dcc9ad'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(M + PAD, y); ctx.lineTo(W - M - PAD, y); ctx.stroke(); ctx.restore();
  }
  function row(ctx, y, l, r, o) {
    o = o || {};
    ctx.font = (o.bold ? 'bold ' : '') + (o.size || 14) + 'px ' + (o.font || MONO);
    ctx.fillStyle = o.colour || INK;
    ctx.textAlign = 'left'; ctx.fillText(fit(ctx, l, PW - PAD * 2 - ctx.measureText(r).width - 12), M + PAD, y);
    ctx.textAlign = 'right'; ctx.fillText(r, W - M - PAD, y);
  }
  function paperPath(ctx, top, bottom) {
    const t = 8, x0 = M, x1 = W - M;
    ctx.beginPath(); ctx.moveTo(x0, top + t);
    for (let x = x0; x < x1; x += t * 2) { ctx.lineTo(x + t, top); ctx.lineTo(Math.min(x + t * 2, x1), top + t); }
    ctx.lineTo(x1, bottom - t);
    for (let x = x1; x > x0; x -= t * 2) { ctx.lineTo(x - t, bottom); ctx.lineTo(Math.max(x - t * 2, x0), bottom - t); }
    ctx.closePath();
  }
  function barcode(ctx, y, seed, accent) {
    const rng = root.PBCore.rngFrom('bar' + seed); let x = (W - 232) / 2; const end = x + 232;
    ctx.fillStyle = INK;
    while (x < end) { const w = 1 + Math.floor(rng() * 3); if (rng() > 0.35) ctx.fillRect(x, y, w, 44); x += w + 1 + Math.floor(rng() * 2); }
  }

  /* draws the whole receipt; if H is given it also paints the backdrop and paper first. Returns end y. */
  function render(ctx, m, img, H, pawImg) {
    const Art = root.Art, C = root.PBCore, accent = m.logoBg;
    if (H) {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, Art.shade(accent, 0.8)); g.addColorStop(1, Art.shade(accent, 0.62));
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

      paperPath(ctx, M, H - M); ctx.fillStyle = '#fffaf0'; ctx.fill(); ctx.restore();
      ctx.save(); paperPath(ctx, M, H - M); ctx.clip();
      ctx.fillStyle = accent; ctx.fillRect(0, M, W, 7); ctx.restore();
    }
    let y = M + 30;
    if (img) ctx.drawImage(img, (W - 76) / 2, y, 76, 76);
    y += 76 + 30;
    ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.font = 'bold 27px ' + SANS;
    wrap(ctx, m.store, PW - PAD * 2).forEach(l => { ctx.fillText(l, W / 2, y); y += 31; });
    ctx.font = 'italic 13px ' + SANS; ctx.fillStyle = GREY;
    ctx.fillText('thank you for shopping with us', W / 2, y); y += 22;
    dashed(ctx, y); y += 24;
    row(ctx, y, 'Receipt', '#' + String(m.no).padStart(4, '0'), { size: 13, colour: GREY }); y += 20;
    row(ctx, y, 'Date', C.fmtDate(m.date), { size: 13, colour: GREY }); y += 20;
    row(ctx, y, 'Time', C.fmtTime(m.date), { size: 13, colour: GREY }); y += 20;
    row(ctx, y, 'Served by', m.operator, { size: 13, colour: GREY }); y += 16;
    dashed(ctx, y); y += 26;
    m.lines.forEach(l => {
      row(ctx, y, (l.qty > 1 ? l.qty + ' x ' : '') + l.name, C.money(l.total)); y += 22;
      if (l.qty > 1) { row(ctx, y - 3, '    @ ' + C.money(l.unit) + ' each', '', { size: 11, colour: GREY }); y += 16; }
    });
    y += 2; dashed(ctx, y); y += 24;
    row(ctx, y, 'ITEMS', String(m.count), { size: 13, colour: GREY }); y += 14;
    ctx.fillStyle = accent; ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(M + PAD - 6, y, PW - PAD * 2 + 12, 46, 12); else ctx.rect(M + PAD - 6, y, PW - PAD * 2 + 12, 46);
    ctx.fill();
    row(ctx, y + 31, 'TOTAL', C.money(m.total), { bold: true, size: 22, font: SANS, colour: '#fff' }); y += 46 + 28;
    if (m.method === 'cash') {
      row(ctx, y, 'CASH TENDERED', C.money(m.tendered), { size: 14 }); y += 21;
      row(ctx, y, 'CHANGE', C.money(m.change), { size: 14, bold: true }); y += 14;
    } else {
      row(ctx, y, 'CARD', C.money(m.total), { size: 14 }); y += 21;
      row(ctx, y, 'PIN VERIFIED', '✓', { size: 13, colour: GREY }); y += 14;
    }
    dashed(ctx, y + 4); y += 34;
    barcode(ctx, y, m.no, accent); y += 44 + 16;
    ctx.textAlign = 'center'; ctx.font = '12px ' + MONO; ctx.fillStyle = GREY;
    ctx.fillText(String(m.no * 7391 % 100000).padStart(5, '0') + ' ' + String(m.no * 4813 % 100000).padStart(5, '0'), W / 2, y); y += 30;
    ctx.font = 'bold 16px ' + SANS; ctx.fillStyle = INK; ctx.fillText('See you again soon!', W / 2, y); y += 22;
    if (pawImg) ctx.drawImage(pawImg, (W - 58) / 2, y - 4, 58, 33); y += 40;
    ctx.font = '11px ' + SANS; ctx.fillStyle = GREY; ctx.fillText('a Hendricks & Piper game', W / 2, y); y += 28;
    return y + M;
  }

  function loadSvg(svg) {
    return new Promise(res => {
      const img = new Image();
      img.onload = () => res(img); img.onerror = () => res(null);
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    });
  }
  const loadLogo = m => loadSvg(root.Art.logo(m.logoId, m.logoBg, 152));
  async function make(m) {
    const img = await loadLogo(m), pawImg = await loadSvg(root.Art.paws(116, '#b9a58f'));
    const scratch = document.createElement('canvas').getContext('2d');
    const H = Math.ceil(render(scratch, m, img, 0, pawImg));
    const cv = document.createElement('canvas');
    cv.width = W * SC; cv.height = H * SC;
    const ctx = cv.getContext('2d'); ctx.scale(SC, SC);
    render(ctx, m, img, H, pawImg);
    return cv;
  }
  function blob(cv) { return new Promise(res => cv.toBlob(res, 'image/png')); }

  root.Receipt = { make, blob };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/* Pass the Basket: all DOM, flow and touch handling. */
(function () {
  'use strict';
  const PACK = JSON.parse(document.getElementById('content-pack').textContent);
  const K = window.PBCore, C = K.create(PACK), Art = window.Art, Sfx = window.Sfx;
  const $ = (s, e) => (e || document).querySelector(s);
  const $$ = (s, e) => Array.prototype.slice.call((e || document).querySelectorAll(s));
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = p => K.money(p);

  /* ---------------- storage (localStorage, with in-memory fallback) ---------------- */
  const KEY = 'passbasket:v1';
  let storageOK = true;
  function load() {

  const STAGES = {
    stage1: { n: 1, name: 'Stock', role: 'Shopworker', colour: '#7fa874' },
    stage2: { n: 2, name: 'Shop', role: 'Shopper', colour: '#e8833a' },
    stage3: { n: 3, name: 'Checkout', role: 'Cashier', colour: '#6f93a8' },
    stage4: { n: 4, name: 'Pay', role: 'Customer', colour: '#b86f8e' },

  function go(screen) {

  /* ---------------- top bar ---------------- */
  const ICON_SND = on => '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>' + (on ? '<path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>') + '</svg>';
  const ICON_HOME = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>';
  function renderBar() {

      '<button class="ib" data-act="sound" aria-label="Sound">' + ICON_SND(Sfx.isOn()) + '</button><button class="ib" data-act="menu" aria-label="Menu">' + ICON_HOME + '</button>';

  /* ---------------- red panda tips ---------------- */

      if (s.left.length) return 'Step 1: put the items on the belt. Drag them from the basket, or tap them.';
      if (s.belt.length) return 'Step 2: scan each item. Drag it to the scanner, or tap it. Listen for the beep!';

    t.dataset.txt = txt; t.dataset.open = String(U.tipOpen !== false);

  /* ---------------- title ---------------- */
  function title() {

    view('<div class="screen title scroll">' + leaves() + '<div class="brand">' + Art.paws(46) + '<div class="bw"><b>HENDRICKS &amp; PIPER</b><small>presents</small></div></div><div class="tlogo">' + Art.logo(S.store.logoId, S.store.logoBg, 116, false, true) + '</div>' +
      '<h1>' + esc(PACK.meta.title) + '</h1><p class="sub">' + esc(S.store.name) + ' · a pass-and-play shop game</p>' +
      '<div class="welcome"><span class="panda">' + Art.panda(62) + '</span><div class="bubble">Hello! Stock the shelves, pass the phone, and I will give you tips as we go.</div></div><ol class="steps5"><li>Stock</li><li>Shop</li><li>Checkout</li><li>Pay</li><li>Receipt</li></ol>' +
      '<div class="tbtns"><button class="btn big" data-act="play1">Stage 1 · Stock the shelves</button>' +
      '<button class="btn big alt" data-act="play2"' + (stock ? '' : ' disabled') + '>Stage 2 · Go shopping<small>' + (stock ? stock + ' packs on the shelves' : 'stock the shelves first') + '</small></button>' +
      '<button class="btn big ghost" data-act="setup">Shop setup</button></div>' +
      '<p class="fine">' + (S.settings.handoffs ? 'Pass-and-play: the phone changes hands between stages.' : 'Solo mode: no hand-off screens.') + '</p><p class="fine brandline">a Hendricks &amp; Piper game</p></div>');

  function refreshDock() {

  function toBelt(u) {

  /* BAG THE ITEMS: every scanned item hops into the little bag, one after another */
  function bagAll() {
    const s = U.sale; if (!s || U.bagging || !s.scanned.length || s.left.length || s.belt.length) return;
    U.bagging = true;
    const bag = $('#minibag'), els = $$('.scannedcard .sc'), br = bag && bag.getBoundingClientRect();
    const gap = 110;
    els.forEach((el, i) => {
      const r = el.getBoundingClientRect();
      const dx = br.left + br.width / 2 - (r.left + r.width / 2), dy = br.top + br.height * 0.3 - (r.top + r.height / 2);
      el.style.transition = 'transform .4s cubic-bezier(.5,-.4,.7,1), opacity .4s ease-in';
      el.style.transitionDelay = (i * gap) + 'ms';
      el.style.zIndex = 5;
      void el.offsetWidth;
      el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(.3)'; el.style.opacity = '.1';
      setTimeout(() => { Sfx.play('drop'); bag.classList.remove('wob'); void bag.offsetWidth; bag.classList.add('wob'); }, i * gap + 330);
    });
    setTimeout(() => {
      s.bag = s.bag.concat(s.scanned); s.scanned = []; U.bagging = false;
      Sfx.play('good'); stage3();
    }, els.length * gap + 520);
  }

        '</div><div class="actions"><button class="btn ghost" data-act="clearTender">Clear</button><button class="btn ghost" data-act="exactTender">Exact</button><button class="btn grow" id="handOver" data-act="handOver"></button></div></div>');

  function cashRefresh() {
    const s = U.sale, t = K.tenderTotal(s.tendered), due = s.total;

    const n = (U.sale.pin || '').length, d = $('#pindots'); if (!d) return;

  function bindSwipe() {
    const card = $('#cardbtn'), track = $('#track'); let sx = 0, drag = false, max = 0, played = false;
    card.addEventListener('pointerdown', e => { drag = true; sx = e.clientX; max = track.clientWidth - card.offsetWidth - 8; played = false; card.style.transition = 'none'; card.setPointerCapture(e.pointerId); Sfx.unlock(); });
    card.addEventListener('pointermove', e => {
      if (!drag) return; const x = Math.max(0, Math.min(max, e.clientX - sx)); card.style.transform = 'translateX(' + x + 'px)';

    const end = e => {
      if (!drag) return; drag = false;

    const d = orig ? Object.assign({}, orig) : { id: '', name: '', price: 150, shape: 'box', c1: '#e8743b', c2: '#f4ead2', pattern: 'band' };
    let confirmDel = false;
    const sw = (key) => PACK.palette.map(c => '<button class="swb' + (d[key] === c ? ' on' : '') + '" style="background:' + c + '" data-k="' + key + '" data-c="' + c + '" aria-label="' + c + '"></button>').join('') + '<label class="swb custom" style="background:conic-gradient(red,yellow,lime,aqua,blue,magenta,red)"><input type="color" data-k="' + key + '" value="' + d[key] + '"></label>';
    const b = openSheet('<h3>' + (isNew ? 'New item' : 'Edit item') + '</h3><div class="prev" id="prev"></div>' +
      '<label for="fName">Name</label><input id="fName" maxlength="24" value="' + esc(d.name) + '" placeholder="e.g. Plum Jam">' +
      '<label for="fPrice">Price (£)</label><input id="fPrice" inputmode="decimal" value="' + (d.price / 100).toFixed(2) + '">' +
      '<label>Packet shape</label><div class="opts" id="oShape"></div><label>Main colour</label><div class="sw" id="sw1"></div><label>Pattern colour</label><div class="sw" id="sw2"></div>' +
      '<label>Pattern</label><div class="opts" id="oPat"></div><div class="three"><button class="btn ghost" id="fCancel">Cancel</button>' + (isNew ? '' : '<button class="btn danger" id="fDel">Delete</button>') + '<button class="btn grow" id="fSave">Save</button></div>');
    function paint() {
      $('#prev', b).innerHTML = Art.pack(d, { w: 84 }) + '<div class="ptag"><b>' + esc($('#fName', b).value || 'New item') + '</b><span>' + esc($('#fPrice', b).value) + '</span></div>';
      $('#oShape', b).innerHTML = Art.SHAPES.map(s => '<button class="' + (d.shape === s ? 'on' : '') + '" data-shape="' + s + '">' + Art.pack(Object.assign({}, d, { shape: s }), { w: 34 }) + '<small>' + s + '</small></button>').join('');
      $('#oPat', b).innerHTML = Art.PATTERNS.map(p => '<button class="' + (d.pattern === p ? 'on' : '') + '" data-pat="' + p + '">' + Art.pack(Object.assign({}, d, { pattern: p }), { w: 34 }) + '<small>' + p + '</small></button>').join('');
      $$('.swb[data-c]', b).forEach(x => x.classList.toggle('on', d[x.dataset.k] === x.dataset.c));
    }
    $('#sw1', b).innerHTML = sw('c1'); $('#sw2', b).innerHTML = sw('c2'); paint();
    b.addEventListener('click', e => {
      const t = e.target.closest('button'); if (!t) return;
      if (t.dataset.shape) { d.shape = t.dataset.shape; Sfx.play('tap'); paint(); }
      else if (t.dataset.pat) { d.pattern = t.dataset.pat; Sfx.play('tap'); paint(); }
      else if (t.dataset.c) { d[t.dataset.k] = t.dataset.c; Sfx.play('tap'); paint(); }
      else if (t.id === 'fCancel') closeSheet();
      else if (t.id === 'fDel') { if (!confirmDel) { confirmDel = true; t.textContent = 'Tap again to delete'; return; } if (S.items.length <= 4) { toast('Keep at least 4 items'); return; } S.items = S.items.filter(x => x.id !== orig.id); delete S.shelf[orig.id]; save(); closeSheet(); setupItems(); }
      else if (t.id === 'fSave') {
        const name = $('#fName', b).value.replace(/[<>]/g, '').trim(), price = K.parsePrice($('#fPrice', b).value);
        if (!name) { toast('Give the item a name'); return; }
        if (isNaN(price)) { toast('Price should look like 1.50'); return; }
        d.name = name.slice(0, 24); d.price = price;
        if (isNew) { let base = name.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 14) || 'item', id = base, n = 2; while (C.itemById(S, id)) id = base + n++; d.id = id; S.items.push(d); }
        else Object.assign(orig, d);
        save(); Sfx.play('good'); closeSheet(); setupItems();
      }
    });
    b.addEventListener('input', e => {
      if (e.target.dataset.k) { d[e.target.dataset.k] = e.target.value; paint(); }
      else if (e.target.id === 'fName' || e.target.id === 'fPrice') paint();
    });
  }
  function confirmSheet(msg, yes, cb) {
    const b = openSheet('<h3>' + esc(msg) + '</h3><div class="three"><button class="btn ghost" id="cNo">Stay</button><button class="btn grow" id="cYes">' + esc(yes) + '</button></div>');
    $('#cNo', b).onclick = closeSheet; $('#cYes', b).onclick = () => { closeSheet(); cb(); };
  }

  /* ---------------- leaving a game in progress ---------------- */
  function abandon() { C.returnBasket(S); U.sale = null; U.delivery = null; save(); }
  function goHome() {
    const inPlay = ['stage2', 'stage3', 'stage4', 'stage5', 'hand'].indexOf(U.screen) >= 0 && S.basket.length;
    const leave = () => { abandon(); go('title'); };
    if (inPlay) confirmSheet('Leave this shop trip? The basket goes back on the shelves.', 'Leave', leave); else { U.delivery = null; go('title'); }
  }

  /* ---------------- click actions ---------------- */
  const ACT = {
    play1: () => go('stage1'),
    play2: () => advance('stage2'),
    setup: () => { U.tab = 'store'; go('setup'); },
    home: () => { go('title'); },
    handGo: () => { Sfx.play('tap'); go(U.to); },
    finish1: () => { save(); U.delivery = null; if (C.totalStock(S) > 0) advance('stage2'); else go('title'); },
    toStock: () => { if (S.basket.length) C.returnBasket(S); save(); go('stage1'); },
    doneShop: () => { if (S.basket.length) { Sfx.play('good'); go('stage3'); toast('Shopper done. You are now the CASHIER.'); } },
    signon: () => { const v = $('#opname').value.replace(/[<>]/g, '').trim().slice(0, 16); S.operator = v || 'Operator'; save(); U.sale.step = 'scan'; Sfx.play('approve'); stage3(); },
    bagall: () => bagAll(),
    pay: b => { U.sale.method = b.dataset.m; Sfx.play('total'); advance('stage4'); },
    den: b => { const s = U.sale, d = +b.dataset.d; s.tendered[d] = (s.tendered[d] || 0) + 1; Sfx.play(d >= 500 ? 'note' : 'coin'); cashRefresh(); },
    unden: b => { const s = U.sale, d = +b.dataset.d; if (s.tendered[d] > 0) s.tendered[d]--; Sfx.play('tap'); cashRefresh(); },
    clearTender: () => { U.sale.tendered = {}; Sfx.play('tap'); cashRefresh(); },
    exactTender: () => { const s = U.sale; s.tendered = {}; K.denomsFor(s.total, PACK.denoms).forEach(x => { s.tendered[x.d] = x.n; }); Sfx.play('coin'); cashRefresh(); },
    handOver: () => { if (K.tenderTotal(U.sale.tendered) >= U.sale.total) { Sfx.play('ching'); advance('stage5'); } },
    pinkey: b => { const sl = U.sale; if (!sl.cardOk || sl.pinOk) return; if ((sl.pin || '').length < 4) { sl.pin = (sl.pin || '') + b.dataset.k; Sfx.play('key'); pinRefresh(); } },
    pinback: () => { const sl = U.sale; if (!sl.cardOk || sl.pinOk) return; sl.pin = (sl.pin || '').slice(0, -1); Sfx.play('tap'); pinRefresh(); },
    pinOk: () => {
      const sl = U.sale; if (!sl.cardOk || sl.pinOk) return;
      if ((sl.pin || '').length < 4) { Sfx.play('wrong'); const d = $('#pindots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); toast('Enter any 4 numbers'); return; }
      Sfx.play('approve'); sl.pinOk = true; $('#pinbox').innerHTML = '<h4>PIN ACCEPTED ✓</h4>'; setTimeout(() => advance('stage5'), 650);
    },
    accept, issue: issueReceipt,
    share: shareImage,
    email: () => {
      const m = U.sale.model, url = 'mailto:?subject=' + encodeURIComponent('Your receipt from ' + m.store) + '&body=' + encodeURIComponent(C.receiptText(m));
      try { window.location.href = url; } catch (e) { toast('Could not open email here. Try Copy text.'); }
      toast('Opening your email app… use Save PNG or Share to send the picture.');
    },
    savepng: async () => { const s = U.sale; if (!s.canvas) { toast('No image available'); return; } downloadBlob(await Receipt.blob(s.canvas), 'receipt.png'); toast('Receipt image saved'); },
    copytext: () => copyText(C.receiptText(U.sale.model)),
    next: nextCustomer,
    sound: () => { Sfx.setOn(!Sfx.isOn()); renderBar(); if (Sfx.isOn()) Sfx.play('tap'); },
    sndset: b => { Sfx.setOn(b.dataset.v === '1'); renderBar(); setupGame(); if (Sfx.isOn()) Sfx.play('tap'); },
    menu: goHome,
    tiptoggle: () => { U.tipOpen = U.tipOpen === false; Sfx.play('tap'); renderTip(); },
    tab: b => { U.tab = b.dataset.t; Sfx.play('tap'); setup(); },
    logo: b => { S.store.logoId = b.dataset.id; save(); renderBar(); setupStore(); Sfx.play('tap'); },
    logobg: b => { S.store.logoBg = b.dataset.c; save(); renderBar(); setupStore(); Sfx.play('tap'); },
    edit: b => editItem(b.dataset.id),
    newitem: () => editItem(null),
    set: b => {
      const k = b.dataset.k, v = b.dataset.v; S.settings[k] = (v === 'true' || v === 'false') ? v === 'true' : parseInt(v, 10);
      if (k === 'bayCapacity') { const cap = C.capacity(S); Object.keys(S.shelf).forEach(id => { S.shelf[id] = Math.min(S.shelf[id], cap); }); }
      save(); Sfx.play('tap'); setupGame();
    },
    export: () => { downloadBlob(new Blob([JSON.stringify(C.serialize(S), null, 1)], { type: 'application/json' }), 'pass-the-basket-save.json'); toast('Save file downloaded'); },
    importfile: () => $('#ifile').click(),
    copysave: () => copyText(JSON.stringify(C.serialize(S))),
    loadpaste: () => { const t = $('#paste').value.trim(); if (!t) { toast('Paste some save text first'); return; } applyImport(t); },
    reset: b => { if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Tap again to wipe everything'; return; } S = C.defaultState(); save(); renderBar(); toast('Shop reset'); setup(); }
  };
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    Sfx.unlock(); const f = ACT[b.dataset.act]; if (f) f(b, e);
  });

  /* ---------------- drag and drop (touch + mouse via pointer events) ---------------- */
  let drag = null, raf = 0;
  const DROPS = { tray: 'bay', shelf: 'basket', basket2: 'shelf', basket3: 'belt', belt: 'scanner' };
  function targetAt(x, y) {
    const e = document.elementFromPoint(x, y); if (!e) return null;
    return e.closest('[data-bay],[data-drop]');
  }
  function validTarget(d, t) {
    if (!t) return false;
    if (d.from === 'tray') return t.dataset.bay === d.item;
    const kind = t.dataset.drop;
    if (d.from === 'basket3') return kind === 'belt';
    if (d.from === 'basket2') return t.dataset.bay !== undefined || kind === 'shelf';
    return kind === DROPS[d.from];
  }
  function ghostPoint(x, y) { return [x, y - 28 - drag.gh / 2]; }
  function dragMove(x, y) {
    drag.x = x; drag.y = y;
    drag.ghost.style.transform = 'translate(' + (x - drag.gw / 2) + 'px,' + (y - 28 - drag.gh) + 'px) scale(1.12)';
    const p = ghostPoint(x, y), t = targetAt(p[0], p[1]);
    if (drag.hot && drag.hot !== t) drag.hot.classList.remove('hot', 'hotbad');
    drag.hot = t;
    if (t) { const ok = validTarget(drag, t); t.classList.toggle('hot', ok); t.classList.toggle('hotbad', !ok && t.dataset.bay !== undefined); }
  }
  function tick() {
    if (!drag || !drag.started) return;
    const w = $('#shelfwrap');
    if (w && (drag.from === 'tray' || drag.from === 'basket2')) {
      const r = w.getBoundingClientRect(); let v = 0;
      if (drag.x < r.left + 56) v = -11; else if (drag.x > r.right - 56) v = 11;
      if (v) { w.scrollLeft += v; dragMove(drag.x, drag.y); }
    }
    raf = requestAnimationFrame(tick);
  }
  document.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    const el = e.target.closest('.dragpack'); if (!el || !$('#view').contains(el)) return;
    Sfx.unlock();
    drag = { el, pid: e.pointerId, sx: e.clientX, sy: e.clientY, started: false, from: el.dataset.from, item: el.dataset.item, idx: +el.dataset.idx, u: +el.dataset.u, hot: null, x: e.clientX, y: e.clientY };
    try { el.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  document.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.pid) return;
    if (!drag.started) {
      if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 8) return;
      drag.started = true; Sfx.play('pick');
      const r = drag.el.getBoundingClientRect(), g = document.createElement('div');
      drag.gw = Math.max(44, r.width * 1.1); drag.gh = drag.gw * 4 / 3;
      g.className = 'dgh'; g.style.width = drag.gw + 'px'; g.innerHTML = drag.el.querySelector('svg').outerHTML;
      document.body.appendChild(g); drag.ghost = g; drag.el.classList.add('lifted'); raf = requestAnimationFrame(tick);
    }
    e.preventDefault(); dragMove(e.clientX, e.clientY);
  }, { passive: false });
  function endDrag(cancelled) {
    const d = drag; if (!d) return; drag = null; cancelAnimationFrame(raf);
    if (d.ghost) d.ghost.remove(); if (d.hot) d.hot.classList.remove('hot', 'hotbad'); d.el.classList.remove('lifted');
    if (cancelled) return;
    if (!d.started) { onTap(d); return; }
    const p = [d.x, d.y - 28 - d.gh / 2], t = targetAt(p[0], p[1]);
    onDrop(d, t);
  }
  document.addEventListener('pointerup', e => { if (drag && e.pointerId === drag.pid) endDrag(false); });
  document.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.pid) endDrag(true); });

  function onTap(d) {
    if (d.from === 'tray') { Sfx.play('tap'); flashBay(d.item); }
    else if (d.from === 'shelf') pickItem(d.item);
    else if (d.from === 'basket2') putBackIdx(d.idx);
    else if (d.from === 'basket3') toBelt(d.u);
    else if (d.from === 'belt') scanItem(d.u);
  }
  function onDrop(d, t) {
    if (!validTarget(d, t)) {
      if (t && t.dataset.drop === 'scanner' && d.from === 'basket3') { Sfx.play('wrong'); toast('Put it on the belt first'); }
      if (d.from === 'tray' && t && t.dataset.bay) { Sfx.play('wrong'); toast('That is not the ' + C.itemById(S, t.dataset.bay).name + ' bay'); }
      return;
    }
    if (d.from === 'tray') {
      if (C.stock(S, d.item)) { U.delivery.splice(d.idx, 1); U.stocked++; save(); Sfx.play('good'); updateBay(d.item); refreshTray(); const b = $('.bay[data-bay="' + d.item + '"]'); if (b) { b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse'); } }
    } else if (d.from === 'shelf') pickItem(d.item);
    else if (d.from === 'basket2') putBackIdx(d.idx);
    else if (d.from === 'basket3') toBelt(d.u);
    else if (d.from === 'belt') scanItem(d.u);
  }

  document.addEventListener('keydown', e => {
    const sl = U.sale; if (U.screen !== 'stage4' || !sl || !sl.cardOk || sl.pinOk || (e.target && e.target.tagName === 'INPUT')) return;
    if (/^\d$/.test(e.key)) ACT.pinkey({ dataset: { k: e.key } }); else if (e.key === 'Backspace') ACT.pinback(); else if (e.key === 'Enter') ACT.pinOk();
  });
  window.addEventListener('resize', fitShelf);
  window.PP = { S: () => S, U, C, go, save, toast, ACT };
  render();
})();
</script>
</body>
</html>
